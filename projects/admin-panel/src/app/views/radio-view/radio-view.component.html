<div class="showcase-page">
  <header class="showcase-header"><h1>Radio</h1><p>گزینه تکی، گروه CVA، checked، disabled و جهت.</p></header>
  <section class="showcase-section"><h2>Radio group</h2><div class="showcase-example">
    <mytag-radio-group [(ngModel)]="selection" name="selection">
      <mytag-radio radioValue="first" label="گزینه اول"></mytag-radio>
      <mytag-radio radioValue="second" label="گزینه دوم"></mytag-radio>
      <mytag-radio radioValue="third" label="گزینه سوم"></mytag-radio>
    </mytag-radio-group>
    <small>مقدار انتخاب‌شده: {{ selection }}</small>
  </div></section>
  <section class="showcase-section"><h2>حالت‌ها</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>Checked</h3><mytag-radio radioValue="yes" label="انتخاب‌شده" [checked]="true"></mytag-radio></div>
    <div class="showcase-example"><h3>Disabled</h3><mytag-radio radioValue="no" label="غیرفعال" [disabled]="true"></mytag-radio></div>
    <div class="showcase-example"><h3>LTR</h3><mytag-radio radioValue="ltr" label="Left to right" dir="ltr"></mytag-radio></div>
  </div></section>
  <app-component-documentation component="radio"></app-component-documentation>
</div>
