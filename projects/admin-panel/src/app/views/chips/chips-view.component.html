<div class="showcase-page">
  <header class="showcase-header"><h1>Chip</h1><p>Action و Filter در variantها، اندازه‌ها و stateهای مختلف.</p></header>
  <section class="showcase-section"><h2>Action</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>Neutral / md</h3><mytag-chip label="برچسب" size="md" variant="neutral" type="action"></mytag-chip></div>
    <div class="showcase-example"><h3>Primary / sm / rounded</h3><mytag-chip label="پیشنهاد ویژه" size="sm" variant="primary" type="action" [rounded]="true"></mytag-chip></div>
    <div class="showcase-example"><h3>Add + remove</h3><mytag-chip label="قابل ویرایش" [showAdd]="true" [showRemove]="true" (added)="onAdd()" (removed)="onRemove()"></mytag-chip><small>آخرین رویداد: {{ lastAction }}</small></div>
  </div></section>
  <section class="showcase-section"><h2>Filter و state</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>Neutral filter</h3><mytag-chip label="صبحانه" type="filter" [(selected)]="neutralSelected"></mytag-chip></div>
    <div class="showcase-example"><h3>Primary selected</h3><mytag-chip label="قابل استرداد" variant="primary" type="filter" [(selected)]="primarySelected" [rounded]="true"></mytag-chip></div>
    <div class="showcase-example"><h3>Disabled</h3><mytag-chip label="غیرفعال" [disabled]="true"></mytag-chip></div>
  </div></section>
  <section class="showcase-section"><h2>کد نمونه</h2><pre class="showcase-code"><code>{{ code }}</code></pre></section>
</div>
