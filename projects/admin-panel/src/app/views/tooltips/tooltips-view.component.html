<div class="showcase-page">
  <header class="showcase-header"><h1>Tooltip</h1><p>چهار موقعیت، arrow، offset، forcePosition، delay و outputها؛ برای نمایش روی trigger مکث کنید.</p></header>
  <ng-template #tooltipContent><span class="text-text">اطلاعات تکمیلی این بخش</span></ng-template>
  <section class="showcase-section"><h2>موقعیت‌ها</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>Top</h3><mytag-tooltip [popUpTemplate]="tooltipContent" position="top"><button type="button" class="border p-2 rounded">بالا</button></mytag-tooltip></div>
    <div class="showcase-example"><h3>Bottom</h3><mytag-tooltip [popUpTemplate]="tooltipContent" position="bottom"><button type="button" class="border p-2 rounded">پایین</button></mytag-tooltip></div>
    <div class="showcase-example"><h3>Left</h3><mytag-tooltip [popUpTemplate]="tooltipContent" position="left"><button type="button" class="border p-2 rounded">چپ</button></mytag-tooltip></div>
    <div class="showcase-example"><h3>Right</h3><mytag-tooltip [popUpTemplate]="tooltipContent" position="right"><button type="button" class="border p-2 rounded">راست</button></mytag-tooltip></div>
  </div></section>
  <section class="showcase-section"><h2>تنظیمات</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>No arrow</h3><mytag-tooltip [popUpTemplate]="tooltipContent" [showArrow]="false"><button type="button" class="border p-2 rounded">بدون فلش</button></mytag-tooltip></div>
    <div class="showcase-example"><h3>Custom offset</h3><mytag-tooltip [popUpTemplate]="tooltipContent" [offset]="20"><button type="button" class="border p-2 rounded">فاصله ۲۰</button></mytag-tooltip></div>
    <div class="showcase-example"><h3>Force position</h3><mytag-tooltip [popUpTemplate]="tooltipContent" position="right" [forcePosition]="true"><button type="button" class="border p-2 rounded">موقعیت ثابت</button></mytag-tooltip></div>
    <div class="showcase-example"><h3>Delay + outputs</h3><mytag-tooltip [popUpTemplate]="tooltipContent" [delayEnter]="0" [delayLeave]="300" (closed)="onClosed()" (visibleChange)="onVisibleChange($event)"><button type="button" class="border p-2 rounded">رویدادها</button></mytag-tooltip><small>{{ lastEvent }}</small></div>
  </div></section>
  <app-component-documentation component="tooltips"></app-component-documentation>
</div>
