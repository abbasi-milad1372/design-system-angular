<div class="showcase-page">
  <header class="showcase-header"><h1>Switch</h1><p>حالت روشن و خاموش، required، disabled و رویداد changed.</p></header>
  <section class="showcase-section"><h2>حالت‌ها</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>Off</h3><mytag-switch [(ngModel)]="off" label="دریافت اعلان‌ها"></mytag-switch><small>{{ off }}</small></div>
    <div class="showcase-example"><h3>On</h3><mytag-switch [(ngModel)]="on" label="استفاده از کیف پول"></mytag-switch><small>{{ on }}</small></div>
    <div class="showcase-example"><h3>Required</h3><mytag-switch [(ngModel)]="off" label="تایید شرایط" [required]="true"></mytag-switch></div>
    <div class="showcase-example"><h3>Disabled</h3><mytag-switch [disabled]="true" label="غیرفعال"></mytag-switch></div>
  </div></section>
  <app-component-documentation component="switch"></app-component-documentation>
</div>
