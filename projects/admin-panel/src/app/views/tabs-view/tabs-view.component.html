<div class="showcase-page">
  <header class="showcase-header"><h1>Tab</h1><p>اندازه، active، disabled، border، rounded، icon و layout عمودی.</p></header>
  <section class="showcase-section"><h2>اندازه و state</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>md / active</h3><mytag-tab label="محبوب‌ترین" size="md" [active]="true"></mytag-tab></div>
    <div class="showcase-example"><h3>sm</h3><mytag-tab label="ارزان‌ترین" size="sm"></mytag-tab></div>
    <div class="showcase-example"><h3>Disabled</h3><mytag-tab label="غیرفعال" [disabled]="true"></mytag-tab></div>
  </div></section>
  <section class="showcase-section"><h2>قاب و محتوا</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>Border</h3><mytag-tab label="لبه‌دار" [border]="true"></mytag-tab></div>
    <div class="showcase-example"><h3>Rounded full</h3><mytag-tab label="کاملاً گرد" [border]="true" [roundedFull]="true"></mytag-tab></div>
    <div class="showcase-example"><h3>Left + right icon</h3><mytag-tab label="موارد"><span icon-right class="iho-icon-hut"></span><span icon-left class="iho-icon-arrow-left-01-sharp"></span></mytag-tab></div>
    <div class="showcase-example"><h3>Icon top</h3><mytag-tab label="تفریحات" layout="icon-top" [active]="true"><span icon-top class="iho-icon-hut text-xl"></span></mytag-tab></div>
    <div class="showcase-example"><h3>Badge slot</h3><mytag-tab label="پیام‌ها"><mytag-badge badge label="۳" size="sm" variant="error" [radius]="true"></mytag-badge></mytag-tab></div>
  </div></section>
  <section class="showcase-section"><h2>کد نمونه</h2><pre class="showcase-code"><code>{{ code }}</code></pre></section>
</div>
