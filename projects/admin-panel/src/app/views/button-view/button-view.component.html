<div class="showcase-page">
  <header class="showcase-header">
    <h1>Button</h1>
    <p>Variantها، اندازه‌ها، حالت غیرفعال، Loading، آیکن و لینک.</p>
  </header>

  <section class="showcase-section">
    <h2>Variantها</h2>
    <div class="showcase-grid">
      <div class="showcase-example" *ngFor="let variant of variants">
        <h3>{{ variant }}</h3>
        <iho-button [variant]="variant" size="md"><span label>دکمه نمونه</span></iho-button>
      </div>
    </div>
  </section>

  <section class="showcase-section">
    <h2>اندازه‌ها</h2>
    <div class="showcase-grid">
      <div class="showcase-example" *ngFor="let size of sizes">
        <h3>{{ size }}</h3>
        <iho-button variant="primary" [size]="size"><span label>دکمه {{ size }}</span></iho-button>
      </div>
    </div>
  </section>

  <section class="showcase-section">
    <h2>حالت‌ها و محتوا</h2>
    <div class="showcase-grid">
      <div class="showcase-example"><h3>Disabled</h3><iho-button [disabled]="true"><span label>غیرفعال</span></iho-button></div>
      <div class="showcase-example"><h3>Loading</h3><iho-button [showLoading]="true"><span label>در حال ثبت</span></iho-button></div>
      <div class="showcase-example"><h3>Icons</h3><iho-button><span icon-right class="iho-icon-user"></span><span label>حساب کاربری</span><span icon-left class="iho-icon-arrow-left-01-sharp"></span></iho-button></div>
      <div class="showcase-example"><h3>Link + full width</h3><iho-button type="link" href="/hotels" [widthPercent]="100"><span label>مشاهده هتل‌ها</span></iho-button></div>
    </div>
  </section>

  <section class="showcase-section"><h2>کد نمونه</h2><pre class="showcase-code"><code>{{ code }}</code></pre></section>
</div>
