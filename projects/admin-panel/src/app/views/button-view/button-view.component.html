<div class="showcase-page">
  <header class="showcase-header">
    <h1>Button</h1>
    <p>Variantها، اندازه‌ها، حالت غیرفعال، Loading، آیکن و لینک.</p>
  </header>

  <section class="showcase-section">
    <h2>Variantها</h2>
    <div class="showcase-grid">
      <div class="showcase-example" *ngFor="let variant of variants">
        <h3>{{ variant }}</h3>
        <mytag-button [variant]="variant" size="md"><span label>دکمه نمونه</span></mytag-button>
      </div>
    </div>
  </section>

  <section class="showcase-section">
    <h2>اندازه‌ها</h2>
    <div class="showcase-grid">
      <div class="showcase-example" *ngFor="let size of sizes">
        <h3>{{ size }}</h3>
        <mytag-button variant="primary" [size]="size"><span label>دکمه {{ size }}</span></mytag-button>
      </div>
    </div>
  </section>

  <section class="showcase-section">
    <h2>حالت‌ها و محتوا</h2>
    <div class="showcase-grid">
      <div class="showcase-example"><h3>Disabled</h3><mytag-button [disabled]="true"><span label>غیرفعال</span></mytag-button></div>
      <div class="showcase-example"><h3>Loading</h3><mytag-button [showLoading]="true"><span label>در حال ثبت</span></mytag-button></div>
      <div class="showcase-example"><h3>Icons</h3><mytag-button><span icon-right class="iho-icon-user-11"></span><span label>حساب کاربری</span><span icon-left class="iho-icon-arrow-left-01-sharp"></span></mytag-button></div>
      <div class="showcase-example"><h3>Link + full width</h3><mytag-button type="link" href="/cards" [widthPercent]="100"><span label>مشاهده موارد</span></mytag-button></div>
    </div>
  </section>

  <app-component-documentation component="button"></app-component-documentation>
</div>
