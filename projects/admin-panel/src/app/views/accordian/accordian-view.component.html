<div class="showcase-page">
  <header class="showcase-header"><h1>Accordion</h1><p>اندازه، variant، باز/بسته، border، radius و disabled.</p></header>
  <section class="showcase-section"><h2>Variant و اندازه</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>Outline / md</h3><iho-accordion title="قوانین رزرو" size="md" variant="outline" [expanded]="true"><p>شرایط کنسلی و قوانین رزرو در این بخش نمایش داده می‌شود.</p></iho-accordion></div>
    <div class="showcase-example"><h3>Filled / sm</h3><iho-accordion title="سوال متداول" size="sm" variant="filled"><p>پاسخ سوال متداول.</p></iho-accordion></div>
  </div></section>
  <section class="showcase-section"><h2>حالت‌ها</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>Borderless + rounded</h3><iho-accordion title="بدون حاشیه" variant="filled" [border]="false" [rounded]="true"><p>محتوای نمونه</p></iho-accordion></div>
    <div class="showcase-example"><h3>Disabled</h3><iho-accordion title="غیرفعال" [disabled]="true"></iho-accordion></div>
  </div></section>
  <section class="showcase-section"><h2>کد نمونه</h2><pre class="showcase-code"><code>{{ code }}</code></pre></section>
</div>
