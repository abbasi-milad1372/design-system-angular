<div class="showcase-page">
  <header class="showcase-header"><h1>Accordion</h1><p>اندازه، variant، باز/بسته، border، radius و disabled.</p></header>
  <section class="showcase-section"><h2>Variant و اندازه</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>Outline / md</h3><mytag-accordion title="شرایط استفاده" size="md" variant="outline" [expanded]="true"><p>شرایط ثبت درخواست و استفاده از خدمات در این بخش نمایش داده می‌شود.</p></mytag-accordion></div>
    <div class="showcase-example"><h3>Filled / sm</h3><mytag-accordion title="سوال متداول" size="sm" variant="filled"><p>پاسخ سوال متداول.</p></mytag-accordion></div>
  </div></section>
  <section class="showcase-section"><h2>حالت‌ها</h2><div class="showcase-grid">
    <div class="showcase-example"><h3>Borderless</h3><mytag-accordion title="بدون حاشیه" variant="filled" [border]="false" [rounded]="false"><p>محتوای نمونه</p></mytag-accordion></div>
    <div class="showcase-example"><h3>Rounded</h3><mytag-accordion title="حاشیه گرد" [border]="true" [rounded]="true"><p>محتوای نمونه</p></mytag-accordion></div>
    <div class="showcase-example"><h3>Disabled</h3><mytag-accordion title="غیرفعال" [disabled]="true"></mytag-accordion></div>
  </div></section>
  <app-component-documentation component="accordian"></app-component-documentation>
</div>
