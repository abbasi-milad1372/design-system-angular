<section *ngIf="features.length" class="footer__features" aria-label="ویژگی‌ها">
    <ul class="footer__feature-list">
        <li *ngFor="let feature of features" class="footer__feature-item">
            <img *ngIf="feature.imageUrl" [src]="feature.imageUrl" width="96" height="96" alt="" />
            <div class="footer__feature-content">
                <p class="footer__feature-title">{{ feature.title }}</p>
                <span class="footer__feature-subtitle">{{ feature.description }}</span>
            </div>
        </li>
    </ul>
</section>
<div class="footer__links" *ngIf="showLinks">
    <ng-content select="[links]"></ng-content>
</div>
<nav class="footer__nav" aria-label="پیوندهای پایین صفحه">
    <div class="footer__details">
        <section *ngFor="let section of sections; let index = index" class="footer__nav-sections">
            <div class="footer__nav-item">
                <h6>
                    <button type="button" (click)="toggleSection(index)" [disabled]="!isMobile"
                        [attr.aria-expanded]="!isMobile || expandedSections[index] !== false"
                        [attr.aria-controls]="sectionId + '-' + index">
                        {{ section.title }}
                        <i *ngIf="isMobile" class="iho-icon-arrow-down-01-sharp" aria-hidden="true"></i>
                    </button>
                </h6>
            </div>
            <ul class="footer__nav-list" [id]="sectionId + '-' + index"
                [hidden]="isMobile && expandedSections[index] === false">
                <li *ngFor="let link of section.links"><a [href]="link.href">{{ link.label }}</a></li>
            </ul>
        </section>
    </div>
    <section class="footer__contact" [attr.aria-label]="brandName">
        <div class="footer__logo-container">
            <a [href]="homeUrl" [attr.aria-label]="brandName">
                <img *ngIf="logoUrl; else textBrand" [src]="logoUrl" [alt]="brandName" height="40" width="40" />
                <ng-template #textBrand>{{ brandName }}</ng-template>
            </a>
        </div>
        <ul class="footer__contact-info">
            <li *ngIf="phoneNumber"><p>تلفن پشتیبانی:</p><a [href]="'tel:' + phoneNumber" dir="ltr">{{ phoneNumber }}</a></li>
            <li *ngFor="let contact of contacts">
                <p>{{ contact.label }}</p>
                <a *ngIf="contact.href; else contactText" [href]="contact.href">{{ contact.value }}</a>
                <ng-template #contactText><span>{{ contact.value }}</span></ng-template>
            </li>
        </ul>
        <div class="footer__certificates"><ng-content select="[certificates]"></ng-content></div>
    </section>
</nav>
<div class="footer__bottom">
    <div class="footer__bottom-container">
        <p class="footer__bottom-text">{{ copyright }}</p>
        <div *ngIf="socialLinks.length" class="footer__social-links">
            <a *ngFor="let link of socialLinks" [href]="link.href" class="footer__social-link" [attr.aria-label]="link.label">
                <i *ngIf="link.icon; else socialText" [class]="link.icon" aria-hidden="true"></i>
                <ng-template #socialText>{{ link.label }}</ng-template>
            </a>
        </div>
    </div>
</div>
