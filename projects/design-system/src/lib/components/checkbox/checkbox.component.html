<label
    class="iho-checkbox"
    [class.iho-checkbox--xs]="size === 'xs'"
    [class.iho-checkbox--sm]="size === 'sm'"
    [class.iho-checkbox--md]="size === 'md'"
    [class.iho-checkbox--disabled]="disabled"
    [dir]="dir"
    [attr.for]="id">

    <input
        class="iho-checkbox__native"
        type="checkbox"
        [id]="id"
        [name]="name || id"
        [required]="required"
        [disabled]="disabled"
        [checked]="value"
        [attr.aria-checked]="indeterminate ? 'mixed' : value"
        [attr.aria-describedby]="supportingText ? id + '-supporting' : null"
        (change)="onInputChange($any($event.target).checked)"
        (blur)="onTouched()" />

    <span
        class="iho-checkbox__box"
        [class.is-checked]="value"
        [class.is-indeterminate]="indeterminate"
        [class.is-disabled]="disabled"
        aria-hidden="true">
        <svg class="iho-checkbox__check" viewBox="0 0 24 24" focusable="false">
            <path d="M19 7L10 17L5 12" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="iho-checkbox__dash"></span>
    </span>

    <span class="iho-checkbox__content" *ngIf="label || supportingText">
        <span
            class="iho-checkbox__label"
            [class.iho-checkbox__label--gray]="color === 'gray'"
            [class.iho-checkbox__label--black]="color === 'black'"
            *ngIf="label">
            {{ label }}
        </span>
        <span class="iho-checkbox__supporting" [id]="id + '-supporting'" *ngIf="supportingText">
            {{ supportingText }}
        </span>
    </span>
</label>
