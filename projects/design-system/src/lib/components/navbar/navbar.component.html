<nav class="flex justify-between items-center p-4 border-b border-gray bg-primary-500 lg:bg-white" aria-label="ناوبری اصلی" (keydown.escape)="closeOnEscape($event)">
    <div class="items-center lg:hidden flex justify-between w-full">
        <button type="button" (click)="onToggleSideNav.emit()" aria-label="باز کردن فهرست کناری"
            class="flex items-center justify-center rounded-full h-9 w-9 lg:hidden">
            <i class="iho-icon-insert-top-image1 text-white text-xl" aria-hidden="true"></i>
        </button>
        <a [href]="homeUrl" [attr.aria-label]="brandName" class="text-white">
            <img *ngIf="logoUrl; else mobileBrand" [src]="logoUrl" [alt]="brandName" height="42" width="42" />
            <ng-template #mobileBrand>{{ brandName }}</ng-template>
        </a>
    </div>
    <div class="items-center gap-4 lg:flex hidden">
        <a [href]="homeUrl" [attr.aria-label]="brandName">
            <img *ngIf="logoUrl; else desktopBrand" [src]="logoUrl" [alt]="brandName" height="48" width="48" />
            <ng-template #desktopBrand>{{ brandName }}</ng-template>
        </a>
        <div *ngIf="menuItems.length" class="relative" (click)="$event.stopPropagation()">
            <button #menuTrigger type="button" (click)="toggleServices($event)"
                [attr.aria-expanded]="showServices" [attr.aria-controls]="menuId"
                class="text-gray-400 hover:text-gray-500 font-medium flex items-center">
                {{ menuLabel }}
                <i class="ml-1 iho-icon-arrow-down-01-sharp text-gray-900 text-xl" aria-hidden="true"></i>
            </button>
            <div *ngIf="showServices" [id]="menuId"
                class="absolute end-0 mt-2 p-2 w-40 bg-white shadow-lg rounded-md z-10">
                <a *ngFor="let item of menuItems" [href]="item.href" (click)="closeServices()"
                    class="block text-gray-400 hover:text-gray-500 py-lg text-sm">{{ item.label }}</a>
            </div>
        </div>
        <a *ngFor="let item of links" [href]="item.href" class="text-gray-400 hover:text-gray-500 px-lg">{{ item.label }}</a>
    </div>
    <div class="lg:flex hidden items-center gap-4">
        <a *ngFor="let item of utilityLinks" [href]="item.href" class="text-gray-400 hover:text-gray-500 flex items-center gap-2">
            <i *ngIf="item.icon" [class]="item.icon" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
        </a>
        <button *ngIf="accountLabel" type="button" class="text-gray-400 hover:text-gray-500 flex items-center gap-2" (click)="openDialogModal.emit()">
            <i class="iho-icon-user-11 text-gray-900 text-xl" aria-hidden="true"></i>
            <span>{{ accountLabel }}</span>
        </button>
    </div>
</nav>
